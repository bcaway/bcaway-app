<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 348" width="818" height="348" fill="none">
  <defs>
    <linearGradient id="rodGradBottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="rodGradMiddle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="rodGradTilted" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
  </defs>

  <!-- Bottom rod -->
  <rect x="0" y="229" width="409" height="119" rx="59.5" fill="url(#rodGradBottom)" />
  <!-- Middle rod -->
  <rect x="90" y="106" width="409" height="119" rx="59.5" fill="url(#rodGradMiddle)" />
  <!-- Tilted rod -->
  <rect x="425" y="66" width="409" height="119" rx="59.5" fill="url(#rodGradTilted)" transform="rotate(27, 629.5, 125.3)" />

  <!-- Carved Jack-O-Lantern Face on Bottom Rod -->
  <g transform="translate(135, 252)">
    <!-- Left eye -->
    <polygon points="18,22 40,22 29,5" fill="#381005" />
    <!-- Right eye -->
    <polygon points="68,22 90,22 79,5" fill="#381005" />
    <!-- Nose -->
    <polygon points="49,27 59,27 54,17" fill="#381005" />
    <!-- Grinning Jack-o-lantern toothy mouth -->
    <path d="M 12 36 Q 54 64 96 36 C 90 49 77 54 69 47 L 69 41 L 59 41 L 59 49 C 51 52 41 49 39 43 L 39 41 L 29 41 L 29 45 C 20 43 15 40 12 36 Z" fill="#381005" />
  </g>

  <!-- Cute Friendly Ghost peeking over middle rod -->
  <g transform="translate(425, 6) scale(1.65)">
    <!-- Ghost Body -->
    <path d="M 28 2 C 14 2 8 16 8 32 C 8 44 11 46 15 41 C 19 46 23 46 27 41 C 31 46 35 46 39 41 C 43 46 47 43 47 32 C 47 16 42 2 28 2 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5" />
    <!-- Ghost Eyes -->
    <ellipse cx="21" cy="18" rx="2.5" ry="3.8" fill="#1E293B" />
    <ellipse cx="34" cy="18" rx="2.5" ry="3.8" fill="#1E293B" />
    <circle cx="20" cy="16.5" r="1" fill="#FFFFFF" />
    <circle cx="33" cy="16.5" r="1" fill="#FFFFFF" />
    <!-- Rosy Cheeks -->
    <circle cx="15.5" cy="22" r="2.5" fill="#F472B6" opacity="0.7" />
    <circle cx="39.5" cy="22" r="2.5" fill="#F472B6" opacity="0.7" />
    <!-- Smile -->
    <path d="M 24 23 Q 27.5 27 31 23" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Little Waving Arm -->
    <path d="M 9 24 C 2 22 2 16 7 14 C 9 14 10 18 9 24 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
  </g>

  <!-- Witch Hat perched on top of Tilted Rod -->
  <g transform="translate(685, 4) rotate(18) scale(1.4)">
    <!-- Brim -->
    <ellipse cx="36" cy="52" rx="38" ry="11" fill="#1E1B4B" stroke="#0F172A" stroke-width="2" />
    <!-- Hat Cone -->
    <path d="M 14 49 C 24 35 28 15 42 5 C 46 12 50 32 58 49 Z" fill="#1E1B4B" stroke="#0F172A" stroke-width="2" />
    <!-- Orange Hat Band -->
    <path d="M 15 47 Q 36 53 57 47 L 58 51 Q 36 57 14 51 Z" fill="#EA580C" />
    <!-- Golden Buckle -->
    <rect x="31" y="46" width="10" height="7" rx="1.5" fill="#FBBF24" stroke="#D97706" stroke-width="1.2" />
    <rect x="33.5" y="47.5" width="5" height="4" rx="0.8" fill="#1E1B4B" />
  </g>

  <!-- Bold Spiderweb on top right -->
  <g stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.85">
    <path d="M 720 180 Q 755 195 810 200" fill="none" />
    <path d="M 680 145 Q 735 170 805 160" fill="none" />
    <path d="M 670 110 L 810 200" fill="none" />
    <path d="M 670 110 L 805 160" fill="none" />
    <path d="M 670 110 L 760 110" fill="none" />
  </g>
  <!-- Dangling Spider -->
  <line x1="720" y1="185" x2="720" y2="245" stroke="#94A3B8" stroke-width="3" stroke-dasharray="4,4" />
  <g transform="translate(720, 252)">
    <!-- Spider Legs -->
    <path d="M -4 -2 Q -12 -8 -16 -3 M -5 1 Q -14 0 -17 5 M -4 4 Q -12 9 -14 14 M 4 -2 Q 12 -8 16 -3 M 5 1 Q 14 0 17 5 M 4 4 Q 12 9 14 14" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Spider Body & Head -->
    <ellipse cx="0" cy="2" rx="7" ry="5.5" fill="#0F172A" />
    <circle cx="0" cy="-3" r="4" fill="#0F172A" />
    <!-- Glowing Red Eyes -->
    <circle cx="-1.8" cy="-3.5" r="1.1" fill="#EF4444" />
    <circle cx="1.8" cy="-3.5" r="1.1" fill="#EF4444" />
  </g>

  <!-- Flying Bats -->
  <g transform="translate(340, 20) scale(1.15)">
    <path d="M 32 16 C 36 9 48 1 61 7 C 55 16 53 20 55 28 C 49 22 43 22 37 26 C 34 20 30 20 27 26 C 21 22 15 22 9 28 C 11 20 9 16 3 7 C 16 1 28 9 32 16 Z" fill="#1E293B" />
  </g>
  <g transform="translate(260, 56) scale(0.7) rotate(-15)">
    <path d="M 32 16 C 36 9 48 1 61 7 C 55 16 53 20 55 28 C 49 22 43 22 37 26 C 34 20 30 20 27 26 C 21 22 15 22 9 28 C 11 20 9 16 3 7 C 16 1 28 9 32 16 Z" fill="#334155" />
  </g>
</svg>
