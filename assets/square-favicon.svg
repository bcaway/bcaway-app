<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <!-- Subtle circular / rounded backing for maximum tab clarity -->
  <rect width="256" height="256" rx="56" fill="#18181B" />

  <!-- Spiderweb in top-left -->
  <path d="M 0 60 Q 30 30 60 0 M 0 35 Q 18 18 35 0 M 0 0 L 60 0 M 0 0 L 42 42 M 0 0 L 0 60" stroke="#71717A" stroke-width="2.5" fill="none" opacity="0.6" />
  
  <!-- Flying bat -->
  <g transform="translate(165, 25) scale(0.7)">
    <path d="M 32 16 C 36 9 48 1 61 7 C 55 16 53 20 55 28 C 49 22 43 22 37 26 C 34 20 30 20 27 26 C 21 22 15 22 9 28 C 11 20 9 16 3 7 C 16 1 28 9 32 16 Z" fill="#E4E4E7" />
  </g>

  <!-- Friendly Ghost peeking on left -->
  <g transform="translate(35, 75) scale(1.1)">
    <path d="M 28 2 C 14 2 8 16 8 32 C 8 44 11 46 15 41 C 19 46 23 46 27 41 C 31 46 35 46 39 41 C 43 46 47 43 47 32 C 47 16 42 2 28 2 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <ellipse cx="21" cy="18" rx="2.5" ry="3.5" fill="#18181B" />
    <ellipse cx="34" cy="18" rx="2.5" ry="3.5" fill="#18181B" />
    <circle cx="16" cy="22" r="2.5" fill="#FDA4AF" />
    <circle cx="39" cy="22" r="2.5" fill="#FDA4AF" />
    <path d="M 24 23 Q 27.5 27 31 23" stroke="#18181B" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Big Jack-o'-Lantern Pumpkin & BCAway Rods Combo -->
  <g transform="translate(18, 55) scale(0.26)">
    <!-- Bottom rod with jack-o-lantern grin -->
    <rect x="0" y="229" width="409" height="119" rx="59.5" fill="#EA580C" />
    <g transform="translate(135, 252)">
      <polygon points="18,22 40,22 29,5" fill="#381005" />
      <polygon points="68,22 90,22 79,5" fill="#381005" />
      <polygon points="49,27 59,27 54,17" fill="#381005" />
      <path d="M 12 36 Q 54 64 96 36 C 90 49 77 54 69 47 L 69 41 L 59 41 L 59 49 C 51 52 41 49 39 43 L 39 41 L 29 41 L 29 45 C 20 43 15 40 12 36 Z" fill="#381005" />
    </g>

    <!-- Middle rod -->
    <rect x="90" y="106" width="409" height="119" rx="59.5" fill="#F97316" />

    <!-- Tilted rod -->
    <rect x="425" y="66" width="409" height="119" rx="59.5" fill="#FB923C" transform="rotate(27, 629.5, 125.3)" />

    <!-- Witch Hat perched on top of Tilted Rod -->
    <g transform="translate(685, 4) rotate(18) scale(1.4)">
      <ellipse cx="36" cy="52" rx="38" ry="11" fill="#4C1D95" stroke="#2E1065" stroke-width="2" />
      <path d="M 14 49 C 24 35 28 15 42 5 C 46 12 50 32 58 49 Z" fill="#4C1D95" stroke="#2E1065" stroke-width="2" />
      <path d="M 15 47 Q 36 53 57 47 L 58 51 Q 36 57 14 51 Z" fill="#EA580C" />
      <rect x="31" y="46" width="10" height="7" rx="1.5" fill="#FBBF24" stroke="#D97706" stroke-width="1.2" />
    </g>
  </g>

  <!-- Big Glowing Jack-o-Lantern in foreground right -->
  <g transform="translate(130, 130) scale(1.6)">
    <!-- Stem -->
    <path d="M 27 12 C 27 6 31 4 34 3 C 33 7 31 10 30 13 Z" fill="#15803D" />
    <!-- Outer lobes -->
    <ellipse cx="27" cy="27" rx="23" ry="19" fill="#EA580C" />
    <ellipse cx="27" cy="27" rx="16" ry="19" fill="#F97316" />
    <ellipse cx="27" cy="27" rx="7" ry="19" fill="#FB923C" />
    <!-- Eyes -->
    <polygon points="17,23 23,23 20,16" fill="#381005" />
    <polygon points="31,23 37,23 34,16" fill="#381005" />
    <!-- Smile -->
    <path d="M 17 30 Q 27 38 37 30 Q 33 35 27 35 Q 21 35 17 30 Z" fill="#381005" />
  </g>

  <!-- Dangling spider -->
  <line x1="225" y1="0" x2="225" y2="70" stroke="#71717A" stroke-width="2" stroke-dasharray="3,3" />
  <g transform="translate(225, 76)">
    <path d="M -3 -2 Q -9 -6 -12 -2 M -4 1 Q -11 0 -13 4 M -3 3 Q -9 7 -11 11 M 3 -2 Q 9 -6 12 -2 M 4 1 Q 11 0 13 4 M 3 3 Q 9 7 11 11" stroke="#E4E4E7" stroke-width="2" stroke-linecap="round" fill="none" />
    <ellipse cx="0" cy="1" rx="5" ry="4" fill="#E4E4E7" />
    <circle cx="0" cy="-2" r="3" fill="#E4E4E7" />
  </g>
</svg>
