<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- Background Canvas -->
    <rect id="bg" width="1024" height="1024" fill="#FFFFFF" />

    <!-- Overall Pumpkin Shading Gradients -->
    <linearGradient id="pmpOuterLeft" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="55%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="pmpOuterRight" x1="100%" y1="20%" x2="0%" y2="80%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="55%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <linearGradient id="pmpMidLeft" x1="15%" y1="15%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="40%" stop-color="#F97316" />
      <stop offset="80%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="pmpMidRight" x1="85%" y1="15%" x2="10%" y2="85%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="40%" stop-color="#F97316" />
      <stop offset="80%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <linearGradient id="pmpCenter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="22%" stop-color="#FB923C" />
      <stop offset="55%" stop-color="#F97316" />
      <stop offset="85%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- Stem Gradients -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="35%" stop-color="#16A34A" />
      <stop offset="70%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <linearGradient id="stemTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Solid Pitch-Black Shadow Void for Carved Logo -->
    <linearGradient id="voidShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1024" height="1024" fill="#FFFFFF" />

  <!-- Soft Ground Shadow below Pumpkin -->
  <ellipse cx="512" cy="892" rx="340" ry="32" fill="#E2E8F0" opacity="0.65" />
  <ellipse cx="512" cy="890" rx="250" ry="20" fill="#CBD5E1" opacity="0.5" />

  <!-- ================= PUMPKIN STEM & FOLIAGE ================= -->
  <g id="pumpkinStem">
    <!-- Stem Cast Shadow on Socket -->
    <path d="M 488 285 C 475 218 502 165 540 148 C 554 142 565 150 562 163 C 555 204 540 244 538 288 Z" fill="#14532D" opacity="0.35" />
    
    <!-- Main Woody Stem -->
    <path d="M 490 284 C 478 214 506 164 542 148 C 556 142 567 151 564 165 C 557 206 541 246 539 287 Z" fill="url(#stemGrad)" stroke="#14532D" stroke-width="7" stroke-linejoin="round" />
    <!-- Stem Highlight Stripe -->
    <path d="M 508 276 C 500 224 518 182 546 162" stroke="#4ADE80" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Stem Cut Top -->
    <ellipse cx="552" cy="154" rx="16" ry="10" transform="rotate(-24, 552, 154)" fill="url(#stemTopGrad)" stroke="#14532D" stroke-width="5" />
    
    <!-- Playful Spiral Vine Tendril -->
    <path d="M 538 280 C 576 258 604 268 594 298 C 582 322 552 314 560 294 C 568 274 592 280 598 294" stroke="#16A34A" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Cute Stylized Pumpkin Leaf -->
    <g transform="translate(545, 275) rotate(22)">
      <path d="M 0 0 C 18 -25 45 -28 65 -15 C 80 -5 85 18 70 34 C 52 50 20 42 0 0 Z" fill="url(#leafGrad)" stroke="#14532D" stroke-width="4.5" stroke-linejoin="round" />
      <path d="M 8 3 Q 40 12 68 15" stroke="#86EFAC" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M 30 10 Q 38 -5 50 -12" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M 42 12 Q 48 24 56 30" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- ================= PUMPKIN BODY (Unified Illustrated Silhouette) ================= -->
  <g id="pumpkinBody">
    <!-- Top Socket Depression -->
    <ellipse cx="512" cy="286" rx="66" ry="20" fill="#7C2D12" />

    <!-- Unified Outer Silhouette with Bold Cartoon Stroke -->
    <!-- Composite path tracing the outermost scalloped curves of all lobes -->
    <path d="
      M 512 286 
      C 440 274 360 274 290 312 
      C 200 360 148 456 148 578 
      C 148 700 202 798 290 848 
      C 362 882 444 882 512 882 
      C 580 882 662 882 734 848 
      C 822 798 876 700 876 578 
      C 876 456 824 360 734 312 
      C 664 274 584 274 512 286 Z" 
      fill="url(#pmpOuterLeft)" 
      stroke="#7C2D12" 
      stroke-width="9" 
      stroke-linejoin="round" />

    <!-- 1. Outer Left Lobe Fill -->
    <path d="M 512 286 C 360 270 148 350 148 578 C 148 770 350 874 512 882 Z" fill="url(#pmpOuterLeft)" />

    <!-- 2. Outer Right Lobe Fill -->
    <path d="M 512 286 C 664 270 876 350 876 578 C 876 770 674 874 512 882 Z" fill="url(#pmpOuterRight)" />

    <!-- 3. Mid Left Lobe -->
    <path d="M 512 286 C 385 272 250 354 250 578 C 250 766 395 874 512 882 Z" fill="url(#pmpMidLeft)" />

    <!-- 4. Mid Right Lobe -->
    <path d="M 512 286 C 639 272 774 354 774 578 C 774 766 629 874 512 882 Z" fill="url(#pmpMidRight)" />

    <!-- 5. Central Front Lobe (Plump, round belly) -->
    <path d="M 512 286 C 420 280 336 370 336 578 C 336 764 425 876 512 882 C 599 876 688 764 688 578 C 688 370 604 280 512 286 Z" fill="url(#pmpCenter)" />

    <!-- Soft Illustrated Crease Shadows Defining the Lobes (Without harsh black borders) -->
    <path d="M 512 286 C 430 368 392 505 398 670 C 404 770 448 848 512 880" stroke="#C2410C" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M 512 286 C 594 368 632 505 626 670 C 620 770 576 848 512 880" stroke="#C2410C" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M 512 286 C 360 365 315 500 320 660 C 324 760 375 835 440 870" stroke="#9A3412" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.35" />
    <path d="M 512 286 C 664 365 709 500 704 660 C 700 760 649 835 584 870" stroke="#9A3412" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.35" />

    <!-- Top Ambient Glow on Pumpkin Upper Curve -->
    <ellipse cx="512" cy="336" rx="145" ry="30" fill="#FEF08A" opacity="0.28" />
  </g>

  <!-- ================= CARVED BCAWAY ICON (Black Shadow) ================= -->
  <!-- 
       Positioned directly across the belly of the pumpkin.
       Mathematically centered at (512, 565).
       The BCAway 3-rod logo is carved out of the pumpkin as a deep black shadow void.
  -->
  <g id="carvedBCAwayIcon" transform="translate(252, 463.4) scale(0.62)">
    <!-- 
         Layer 1: Carved Pumpkin Rind Depth (Exposed flesh thickness inside cutout)
         Slightly offset down by 4.5px with rich warm pumpkin flesh color
    -->
    <g transform="translate(0, 4.5)">
      <rect x="0" y="229" width="409" height="119" rx="59.5" fill="#451A03" />
      <rect x="90" y="106" width="409" height="119" rx="59.5" fill="#451A03" />
      <rect x="425" y="66" width="409" height="119" rx="59.5" fill="#451A03" transform="rotate(27, 629.5, 125.3)" />
    </g>

    <!-- 
         Layer 2: Subtle golden light catch on upper carved rim
    -->
    <g transform="translate(0, -2)">
      <rect x="0" y="229" width="409" height="119" rx="59.5" stroke="#FED7AA" stroke-width="3.5" fill="none" opacity="0.7" />
      <rect x="90" y="106" width="409" height="119" rx="59.5" stroke="#FED7AA" stroke-width="3.5" fill="none" opacity="0.7" />
      <rect x="425" y="66" width="409" height="119" rx="59.5" stroke="#FED7AA" stroke-width="3.5" fill="none" opacity="0.7" transform="rotate(27, 629.5, 125.3)" />
    </g>

    <!-- 
         Layer 3: The Carved Pitch-Black Shadow Void
         Deep solid cutout interior
    -->
    <!-- Bottom rod cutout -->
    <rect x="0" y="229" width="409" height="119" rx="59.5" fill="url(#voidShadow)" stroke="#020408" stroke-width="2" />

    <!-- Middle rod cutout -->
    <rect x="90" y="106" width="409" height="119" rx="59.5" fill="url(#voidShadow)" stroke="#020408" stroke-width="2" />

    <!-- Tilted rod cutout -->
    <rect x="425" y="66" width="409" height="119" rx="59.5" fill="url(#voidShadow)" stroke="#020408" stroke-width="2" transform="rotate(27, 629.5, 125.3)" />
  </g>
</svg>
