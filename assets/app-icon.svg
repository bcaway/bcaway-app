<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="iconRodGradBottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="iconRodGradMiddle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="iconRodGradTilted" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
  </defs>

  <!-- Clean background -->
  <rect width="1024" height="1024" fill="#FFFFFF" />

  <!-- Corner spider web top right -->
  <path d="M 830 0 Q 920 45 1024 45 M 880 0 Q 945 95 1024 105 M 930 0 Q 970 145 1024 155 M 830 0 L 1024 155 M 880 0 L 1024 105 M 930 0 L 1024 45" stroke="#CBD5E1" stroke-width="4.5" fill="none" stroke-linecap="round" />
  <!-- Dangling spider from top right -->
  <line x1="900" y1="45" x2="900" y2="145" stroke="#94A3B8" stroke-width="3.5" stroke-dasharray="5,5" />
  <g transform="translate(900, 155)">
    <path d="M -4 -3 Q -13 -9 -17 -4 M -5 1 Q -15 0 -18 6 M -4 5 Q -13 10 -15 15 M 4 -3 Q 13 -9 17 -4 M 5 1 Q 15 0 18 6 M 4 5 Q 13 10 15 15" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none" />
    <ellipse cx="0" cy="3" rx="11" ry="8.5" fill="#1E293B" />
    <circle cx="0" cy="-5" r="6" fill="#1E293B" />
    <circle cx="-2.5" cy="-5.5" r="1.8" fill="#EF4444" />
    <circle cx="2.5" cy="-5.5" r="1.8" fill="#EF4444" />
  </g>

  <!-- Flying bats in sky -->
  <g transform="translate(680, 150) scale(1.35)">
    <path d="M 32 16 C 36 9 48 1 61 7 C 55 16 53 20 55 28 C 49 22 43 22 37 26 C 34 20 30 20 27 26 C 21 22 15 22 9 28 C 11 20 9 16 3 7 C 16 1 28 9 32 16 Z" fill="#1E293B" />
  </g>
  <g transform="translate(580, 185) scale(0.85) rotate(-12)">
    <path d="M 32 16 C 36 9 48 1 61 7 C 55 16 53 20 55 28 C 49 22 43 22 37 26 C 34 20 30 20 27 26 C 21 22 15 22 9 28 C 11 20 9 16 3 7 C 16 1 28 9 32 16 Z" fill="#475569" />
  </g>

  <!-- Horizontal Logo Mark centered horizontally -->
  <g transform="translate(143.9, 225.0) scale(0.90)">
    <!-- Bottom rod -->
    <rect x="0" y="229" width="409" height="119" rx="59.5" fill="url(#iconRodGradBottom)" />
    <!-- Carved Jack-O-Lantern face on bottom rod -->
    <g transform="translate(135, 252)">
      <polygon points="18,22 40,22 29,5" fill="#381005" />
      <polygon points="68,22 90,22 79,5" fill="#381005" />
      <polygon points="49,27 59,27 54,17" fill="#381005" />
      <path d="M 12 36 Q 54 64 96 36 C 90 49 77 54 69 47 L 69 41 L 59 41 L 59 49 C 51 52 41 49 39 43 L 39 41 L 29 41 L 29 45 C 20 43 15 40 12 36 Z" fill="#381005" />
    </g>

    <!-- Middle rod -->
    <rect x="90" y="106" width="409" height="119" rx="59.5" fill="url(#iconRodGradMiddle)" />

    <!-- Tilted rod -->
    <rect x="425" y="66" width="409" height="119" rx="59.5" fill="url(#iconRodGradTilted)" transform="rotate(27, 629.5, 125.3)" />

    <!-- Cute Friendly Ghost peeking over middle rod -->
    <g transform="translate(425, 4) scale(1.75)">
      <path d="M 28 2 C 14 2 8 16 8 32 C 8 44 11 46 15 41 C 19 46 23 46 27 41 C 31 46 35 46 39 41 C 43 46 47 43 47 32 C 47 16 42 2 28 2 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5" />
      <ellipse cx="21" cy="18" rx="2.5" ry="3.8" fill="#1E293B" />
      <ellipse cx="34" cy="18" rx="2.5" ry="3.8" fill="#1E293B" />
      <circle cx="20" cy="16.5" r="1" fill="#FFFFFF" />
      <circle cx="33" cy="16.5" r="1" fill="#FFFFFF" />
      <circle cx="15.5" cy="22" r="2.5" fill="#F472B6" opacity="0.7" />
      <circle cx="39.5" cy="22" r="2.5" fill="#F472B6" opacity="0.7" />
      <path d="M 24 23 Q 27.5 27 31 23" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M 9 24 C 2 22 2 16 7 14 C 9 14 10 18 9 24 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    </g>

    <!-- Witch Hat perched on top of Tilted Rod -->
    <g transform="translate(685, 4) rotate(18) scale(1.45)">
      <ellipse cx="36" cy="52" rx="38" ry="11" fill="#1E1B4B" stroke="#0F172A" stroke-width="2" />
      <path d="M 14 49 C 24 35 28 15 42 5 C 46 12 50 32 58 49 Z" fill="#1E1B4B" stroke="#0F172A" stroke-width="2" />
      <path d="M 15 47 Q 36 53 57 47 L 58 51 Q 36 57 14 51 Z" fill="#EA580C" />
      <rect x="31" y="46" width="10" height="7" rx="1.5" fill="#FBBF24" stroke="#D97706" stroke-width="1.2" />
      <rect x="33.5" y="47.5" width="5" height="4" rx="0.8" fill="#1E1B4B" />
    </g>
  </g>

  <!-- BCAway Wordmark in Bold Halloween Orange -->
  <text 
    x="512" 
    y="762" 
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif" 
    font-size="188" 
    font-weight="800" 
    letter-spacing="-3" 
    fill="#EA580C" 
    text-anchor="middle">BCAway</text>

  <!-- Big Glowing Jack-o-Lantern by wordmark -->
  <g transform="translate(765, 680) scale(1.15)">
    <path d="M 27 12 C 27 6 31 4 34 3 C 33 7 31 10 30 13 Z" fill="#15803D" />
    <ellipse cx="27" cy="27" rx="23" ry="19" fill="#EA580C" />
    <ellipse cx="27" cy="27" rx="16" ry="19" fill="#F97316" />
    <ellipse cx="27" cy="27" rx="7" ry="19" fill="#FB923C" />
    <polygon points="17,23 23,23 20,16" fill="#381005" />
    <polygon points="31,23 37,23 34,16" fill="#381005" />
    <path d="M 17 30 Q 27 38 37 30 Q 33 35 27 35 Q 21 35 17 30 Z" fill="#381005" />
  </g>
</svg>
